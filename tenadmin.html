<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EOI Dashboard — Tengo Solar Admin</title>
<!--
    ── SETUP ──────────────────────────────────────────────────────────
    1. In Supabase, run this SQL once to create the shared table:

        create table eoi_submissions (
            id uuid primary key default gen_random_uuid(),
            reference_id text unique not null,
            created_at timestamptz default now(),
            name text not null,
            phone text not null,
            is_whatsapp boolean default false,
            email text not null,
            city text not null,
            property_type text default 'home',
            property_owned boolean default true,
            system_type text default 'unsure',
            system_size text,
            bill_range text,
            preferred_time text,
            message text,
            consent boolean default false,
            status text default 'new'
        );

        alter table eoi_submissions enable row level security;

        -- Public site can only INSERT (submit a form), never read others' data
        create policy "public can submit" on eoi_submissions
            for insert to anon with check (true);

        -- Only signed-in staff can read/update/delete
        create policy "staff can manage" on eoi_submissions
            for all to authenticated using (true) with check (true);

       If you set this table up before "reference_id" existed, run instead:
        alter table eoi_submissions
            add column if not exists reference_id text,
            add column if not exists is_whatsapp boolean default false,
            add column if not exists property_owned boolean default true,
            add column if not exists system_type text default 'unsure',
            add column if not exists system_size text,
            add column if not exists consent boolean default false;
        -- then, once every existing row has a reference_id backfilled:
        alter table eoi_submissions alter column reference_id set not null;
        alter table eoi_submissions add constraint eoi_submissions_reference_id_key unique (reference_id);

       Note: an earlier version of this file used an "email_verified" column
       for optional email-OTP verification. That flow has been removed
       (the customer form no longer sends any email at all — instead it
       gives the customer a downloadable PDF of their submission after
       review). If you still have that column, it's harmless to leave in
       place, it's just no longer set by the customer form.

    2. In Supabase → Authentication, create a user account for each staff
       member who should have access (email + password). Anyone who can
       sign in is treated as staff — there is no separate admin password
       hardcoded here, unlike an earlier version of this site's admin panel.

    3. Paste your project URL + anon key into SUPABASE_URL / SUPABASE_ANON_KEY
       below (same values used in the customer-facing eoi-customer.html).
    ─────────────────────────────────────────────────────────────────── -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
        --sun-core:   #FFD84D;
        --sun-amber:  #F5A623;
        --sun-deep:   #E07B0A;
        --sky-void:   #040E1A;
        --sky-deep:   #071525;
        --sky-mid:    #0E2038;
        --sky-rim:    #1A3550;
        --leaf:       #22C55E;
        --leaf-dim:   #16A34A;
        --red:        #EF4444;
        --blue:       #3B82F6;
        --text-body:  #C8DAE8;
        --text-muted: #6B8FA8;
        --text-dim:   #3E607E;
        --radius-sm:  0.5rem;
        --radius-md:  0.85rem;
        --radius-lg:  1.5rem;
        --radius-xl:  2rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: var(--sky-void);
        color: var(--text-body);
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
    }
    h1, h2, h3 { font-family: 'Outfit', sans-serif; color: #fff; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: radial-gradient(ellipse 800px 500px at 50% 0%, rgba(245,166,35,0.1), transparent 70%);
    }
    .login-card {
        width: 100%;
        max-width: 380px;
        background: linear-gradient(160deg, rgba(14,32,56,0.9), rgba(7,21,37,0.9));
        border: 1px solid var(--sky-rim);
        border-radius: var(--radius-xl);
        padding: 2.25rem;
    }
    .login-mark {
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 1rem;
    }
    .logo-mark { flex-shrink: 0; display: block; }
    .wordmark {
        font-weight: 700;
        background: linear-gradient(90deg, #FFFFFF 0%, #FFD000 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .login-card h2 { font-size: 1.3rem; margin-bottom: 0.3rem; }
    .login-card p.sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.6rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-body); }
    input {
        width: 100%;
        background: rgba(4,14,26,0.7);
        border: 1px solid var(--sky-rim);
        border-radius: var(--radius-sm);
        color: #fff;
        font-family: inherit;
        font-size: 0.9rem;
        padding: 0.7rem 0.9rem;
        outline: none;
    }
    input:focus { border-color: var(--sun-amber); }
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: linear-gradient(135deg, var(--sun-core), var(--sun-deep));
        color: #1a1208;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.75rem 1.4rem;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        width: 100%;
        margin-top: 0.4rem;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost {
        background: rgba(255,255,255,0.05);
        color: var(--text-body);
        border: 1px solid var(--sky-rim);
        width: auto;
    }
    .login-error {
        display: none;
        color: var(--red);
        font-size: 0.8rem;
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.25);
        border-radius: var(--radius-sm);
        padding: 0.6rem 0.8rem;
        margin-bottom: 1rem;
    }

    /* ── DASHBOARD ── */
    #dashboard { display: none; }
    header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.1rem 1.5rem;
        border-bottom: 1px solid var(--sky-rim);
        position: sticky; top: 0;
        background: rgba(4,14,26,0.92);
        backdrop-filter: blur(10px);
        z-index: 20;
    }
    header.top .brand { display: flex; align-items: center; gap: 0.6rem; font-family: 'Outfit'; font-weight: 700; color: #fff; }
    header.top .brand span.amber { color: var(--sun-amber); }
    #userEmail { font-size: 0.78rem; color: var(--text-muted); margin-right: 0.9rem; }

    .container { max-width: 1100px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

    /* KPI row */
    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.75rem; }
    .kpi-card {
        background: linear-gradient(160deg, rgba(14,32,56,0.75), rgba(7,21,37,0.75));
        border: 1px solid var(--sky-rim);
        border-radius: var(--radius-lg);
        padding: 1.1rem 1.25rem;
    }
    .kpi-card .lbl { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem; }
    .kpi-card .num { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 600; color: #fff; }
    .kpi-card.new .num { color: var(--sun-amber); }
    .kpi-card.converted .num { color: var(--leaf); }

    /* toolbar */
    .toolbar {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1.1rem;
    }
    .toolbar input, .toolbar select {
        background: rgba(4,14,26,0.7);
        border: 1px solid var(--sky-rim);
        border-radius: var(--radius-sm);
        color: #fff;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 0.6rem 0.85rem;
        outline: none;
    }
    .toolbar input { flex: 1; min-width: 180px; }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--sun-amber); }
    .toolbar select option { background: var(--sky-deep); }
    .badge-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
        font-size: 0.68rem;
        font-weight: 600;
        border-radius: 999px;
        padding: 0.1rem 0.45rem;
        margin-left: 0.35rem;
    }
    .badge-tag.wa { background: rgba(34,197,94,0.15); color: var(--leaf); }
    .btn-export {
        background: rgba(245,166,35,0.1);
        border: 1px solid rgba(245,166,35,0.3);
        color: var(--sun-amber);
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
        font-weight: 600;
        padding: 0.6rem 1rem;
        cursor: pointer;
    }

    /* table card */
    .table-card {
        background: linear-gradient(160deg, rgba(14,32,56,0.75), rgba(7,21,37,0.75));
        border: 1px solid var(--sky-rim);
        border-radius: var(--radius-lg);
        overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
        text-align: left;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--sky-rim);
        white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
    tbody tr:hover { background: rgba(245,166,35,0.04); }
    tbody td { padding: 0.85rem 1rem; font-size: 0.85rem; vertical-align: top; }
    td.name-cell { color: #fff; font-weight: 600; }
    td.sub { color: var(--text-muted); font-size: 0.78rem; }

    .status-pill {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        text-transform: capitalize;
    }
    .status-pill.new { background: rgba(245,166,35,0.15); color: var(--sun-amber); }
    .status-pill.contacted { background: rgba(59,130,246,0.15); color: var(--blue); }
    .status-pill.quoted { background: rgba(168,85,247,0.15); color: #c084fc; }
    .status-pill.converted { background: rgba(34,197,94,0.15); color: var(--leaf); }
    .status-pill.not_interested { background: rgba(239,68,68,0.15); color: var(--red); }

    select.status-select {
        background: rgba(4,14,26,0.8);
        border: 1px solid var(--sky-rim);
        border-radius: 999px;
        color: var(--text-body);
        font-size: 0.75rem;
        padding: 0.3rem 0.55rem;
    }

    .btn-pdf {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--sky-rim);
        border-radius: var(--radius-sm);
        color: var(--text-body);
        font-size: 0.95rem;
        padding: 0.35rem 0.55rem;
        cursor: pointer;
        line-height: 1;
    }
    .btn-pdf:hover { border-color: var(--sun-amber); background: rgba(245,166,35,0.08); }
    .btn-pdf-full {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        background: rgba(245,166,35,0.1);
        border: 1px solid rgba(245,166,35,0.3);
        color: var(--sun-amber);
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.65rem;
        cursor: pointer;
        margin-top: 1rem;
    }
    .btn-pdf-full:hover { background: rgba(245,166,35,0.18); }

    .empty-state, .loading-state {
        text-align: center;
        padding: 3.5rem 1.5rem;
        color: var(--text-muted);
    }
    .empty-state .ico { font-size: 2rem; margin-bottom: 0.75rem; }

    /* ── DETAIL DRAWER ── */
    .drawer-overlay {
        position: fixed; inset: 0;
        background: rgba(4,14,26,0.7);
        backdrop-filter: blur(4px);
        z-index: 40;
        display: none;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 380px;
        max-width: calc(100vw - 2rem);
        background: linear-gradient(160deg, rgba(14,32,56,0.98), rgba(7,21,37,0.98));
        border-left: 1px solid var(--sky-rim);
        z-index: 41;
        transform: translateX(100%);
        transition: transform 0.25s ease;
        overflow-y: auto;
        padding: 1.5rem;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-close { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; float: right; }
    .drawer h3 { font-size: 1.15rem; margin: 0.5rem 0 0.2rem; }
    .drawer .drawer-sub { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1.2rem; }
    .drawer dl { display: grid; grid-template-columns: 100px 1fr; gap: 0.6rem 0.75rem; font-size: 0.85rem; margin-bottom: 1.4rem; }
    .drawer dt { color: var(--text-muted); }
    .drawer dd { color: var(--text-body); }
    .drawer .msg-box {
        background: rgba(4,14,26,0.6);
        border: 1px solid var(--sky-rim);
        border-radius: var(--radius-sm);
        padding: 0.75rem;
        font-size: 0.85rem;
        color: var(--text-body);
        margin-bottom: 1.4rem;
        min-height: 60px;
    }

    #toast {
        position: fixed;
        bottom: 1.5rem; left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--sky-mid);
        border: 1px solid var(--sky-rim);
        color: #fff;
        font-size: 0.85rem;
        padding: 0.75rem 1.2rem;
        border-radius: var(--radius-md);
        opacity: 0; visibility: hidden;
        transition: all 0.25s ease;
        z-index: 999;
    }
    #toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
        .kpi-row { grid-template-columns: 1fr 1fr; }
        .kpi-row .kpi-card:last-child { grid-column: span 2; }
        .table-card { overflow-x: auto; }
        table { min-width: 640px; }
    }
</style>
</head>
<body>

    <!-- ══════════ LOGIN ══════════ -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-mark">
                <svg viewBox="0 0 200 200" width="44" height="44" style="flex-shrink:0;">
                    <defs>
                        <radialGradient id="rg1_login" cx="100" cy="100" r="66" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFFAAA"/>
                            <stop offset="28%" stop-color="#FFC200"/>
                            <stop offset="70%" stop-color="#FF7800"/>
                            <stop offset="100%" stop-color="#FF4400"/>
                        </radialGradient>
                        <filter id="f1_login" x="-40%" y="-40%" width="180%" height="180%">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <g transform="translate(100,100)" filter="url(#f1_login)">
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_login)"/>
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_login)" transform="rotate(90)"/>
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_login)" transform="rotate(180)"/>
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_login)" transform="rotate(270)"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_login)" transform="rotate(45)" opacity="0.82"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_login)" transform="rotate(135)" opacity="0.82"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_login)" transform="rotate(225)" opacity="0.82"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_login)" transform="rotate(315)" opacity="0.82"/>
                        <circle r="13.5" fill="url(#rg1_login)"/>
                        <line x1="-9" y1="-4.5" x2="9" y2="-4.5" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="-9" y1="0" x2="9" y2="0" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="-9" y1="4.5" x2="9" y2="4.5" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="-4.5" y1="-9" x2="-4.5" y2="9" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="0" y1="-9" x2="0" y2="9" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="4.5" y1="-9" x2="4.5" y2="9" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <circle r="3.2" fill="#FFFEF0" opacity="0.96"/>
                    </g>
                </svg>
            </div>
            <h2 class="wordmark">Tengo Solar</h2>
            <p class="sub">Staff sign-in — EOI dashboard</p>
            <div class="login-error" id="loginError"></div>
            <form id="loginForm">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="loginEmail" autocomplete="email" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Sign in</button>
            </form>
        </div>
    </div>

    <!-- ══════════ DASHBOARD ══════════ -->
    <div id="dashboard">
        <header class="top">
            <div class="brand">
                <svg class="logo-mark" viewBox="0 0 200 200" width="24" height="24" style="flex-shrink:0;">
                    <defs>
                        <radialGradient id="rg1_adminhdr" cx="100" cy="100" r="66" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFFAAA"/>
                            <stop offset="28%" stop-color="#FFC200"/>
                            <stop offset="70%" stop-color="#FF7800"/>
                            <stop offset="100%" stop-color="#FF4400"/>
                        </radialGradient>
                        <filter id="f1_adminhdr" x="-40%" y="-40%" width="180%" height="180%">
                            <feGaussianBlur stdDeviation="3" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <g transform="translate(100,100)" filter="url(#f1_adminhdr)">
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_adminhdr)"/>
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_adminhdr)" transform="rotate(90)"/>
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_adminhdr)" transform="rotate(180)"/>
                        <polygon points="0,-52 -8,-22 0,-13 8,-22" fill="url(#rg1_adminhdr)" transform="rotate(270)"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_adminhdr)" transform="rotate(45)" opacity="0.82"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_adminhdr)" transform="rotate(135)" opacity="0.82"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_adminhdr)" transform="rotate(225)" opacity="0.82"/>
                        <polygon points="0,-42 -5,-19 0,-13 5,-19" fill="url(#rg1_adminhdr)" transform="rotate(315)" opacity="0.82"/>
                        <circle r="13.5" fill="url(#rg1_adminhdr)"/>
                        <line x1="-9" y1="-4.5" x2="9" y2="-4.5" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="-9" y1="0" x2="9" y2="0" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="-9" y1="4.5" x2="9" y2="4.5" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="-4.5" y1="-9" x2="-4.5" y2="9" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="0" y1="-9" x2="0" y2="9" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <line x1="4.5" y1="-9" x2="4.5" y2="9" stroke="#07102A" stroke-width="1.4" opacity="0.65"/>
                        <circle r="3.2" fill="#FFFEF0" opacity="0.96"/>
                    </g>
                </svg>
                <span class="wordmark">Tengo Solar</span> <span class="amber">· EOI Dashboard</span>
            </div>
            <div style="display:flex;align-items:center;">
                <span id="userEmail"></span>
                <button class="btn btn-ghost" onclick="signOut()" style="padding:0.5rem 0.9rem;font-size:0.8rem;">Sign out</button>
            </div>
        </header>

        <div class="container">
            <div class="kpi-row">
                <div class="kpi-card"><div class="lbl">Total EOIs</div><div class="num" id="kpiTotal">—</div></div>
                <div class="kpi-card new"><div class="lbl">New</div><div class="num" id="kpiNew">—</div></div>
                <div class="kpi-card"><div class="lbl">Last 7 days</div><div class="num" id="kpiWeek">—</div></div>
                <div class="kpi-card converted"><div class="lbl">Converted</div><div class="num" id="kpiConverted">—</div></div>
            </div>

            <div class="toolbar">
                <input type="text" id="searchBox" placeholder="Search by name, phone, city or reference…">
                <select id="statusFilter">
                    <option value="">All statuses</option>
                    <option value="new">New</option>
                    <option value="contacted">Contacted</option>
                    <option value="quoted">Quoted</option>
                    <option value="converted">Converted</option>
                    <option value="not_interested">Not interested</option>
                </select>
                <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Contact</th>
                            <th>City</th>
                            <th>Bill range</th>
                            <th>Submitted</th>
                            <th>Status</th>
                            <th>PDF</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="loading-state" id="loadingState">Loading submissions…</div>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <div class="ico">📭</div>
                    No EOI submissions match this view yet.
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════ DETAIL DRAWER ══════════ -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
        <h3 id="dName">—</h3>
        <p class="drawer-sub" id="dSub">—</p>
        <dl id="dList"></dl>
        <div>
            <label style="font-size:0.78rem;color:var(--text-muted);display:block;margin-bottom:0.4rem;">Message</label>
            <div class="msg-box" id="dMessage">—</div>
        </div>
        <div class="field">
            <label style="font-size:0.78rem;color:var(--text-muted);display:block;margin-bottom:0.4rem;">Status</label>
            <select class="status-select" id="dStatus" style="width:100%;padding:0.55rem;"></select>
        </div>
        <button class="btn-pdf-full" onclick="downloadSubmissionPDF(currentDrawerId)">📄 Download PDF</button>
    </div>

    <div id="toast"></div>

    <script>
        // ── CONFIG ──────────────────────────────────────────────────────
        // Same project as eoi-customer.html — this dashboard reads/writes
        // the "eoi_submissions" table, gated by real Supabase auth (RLS
        // policies restrict reads/writes to signed-in users only).
        const SUPABASE_URL = 'https://lkvhomycyufmzwtyjvbz.supabase.co';       // e.g. 'https://xxxx.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrdmhvbXljeXVmbXp3dHlqdmJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzIxMDIsImV4cCI6MjEwMjgwODEwMn0.494oprs6n3dcHVFQLeYluLIsjsGQg5RPD58H3DZGorY';  // the PUBLIC "anon" key
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const STATUSES = ['new', 'contacted', 'quoted', 'converted', 'not_interested'];
        let sb = null;
        let allRows = [];
        let currentDrawerId = null;

        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3200);
        }

        // ── AUTH ──────────────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('loginError');
            errBox.style.display = 'none';

            if (!sb) {
                errBox.textContent = 'Dashboard not connected — add SUPABASE_URL / SUPABASE_ANON_KEY.';
                errBox.style.display = 'block';
                return;
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Signing in…';

            const { data, error } = await sb.auth.signInWithPassword({ email, password });

            btn.disabled = false; btn.textContent = 'Sign in';

            if (error) {
                errBox.textContent = 'Incorrect email or password.';
                errBox.style.display = 'block';
                return;
            }
            enterDashboard(data.user);
        });

        async function signOut() {
            if (sb) await sb.auth.signOut();
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('loginForm').reset();
        }

        function enterDashboard(user) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userEmail').textContent = user.email;
            loadSubmissions();
        }

        // Restore session on refresh
        (async () => {
            if (!sb) return;
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) enterDashboard(session.user);
        })();

        // ── DATA ──────────────────────────────────────────────────────
        async function loadSubmissions() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';

            const { data, error } = await sb
                .from('eoi_submissions')
                .select('*')
                .order('created_at', { ascending: false });

            document.getElementById('loadingState').style.display = 'none';

            if (error) {
                showToast('❌ Could not load submissions');
                console.error(error);
                return;
            }
            allRows = data || [];
            renderKPIs();
            renderTable();
        }

        function renderKPIs() {
            const total = allRows.length;
            const newCount = allRows.filter(r => r.status === 'new').length;
            const converted = allRows.filter(r => r.status === 'converted').length;
            const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const lastWeek = allRows.filter(r => new Date(r.created_at).getTime() >= weekAgo).length;

            document.getElementById('kpiTotal').textContent = total;
            document.getElementById('kpiNew').textContent = newCount;
            document.getElementById('kpiWeek').textContent = lastWeek;
            document.getElementById('kpiConverted').textContent = converted;
        }

        function statusLabel(s) { return (s || 'new').replace('_', ' '); }

        function escHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function filteredRows() {
            const q = document.getElementById('searchBox').value.trim().toLowerCase();
            const statusF = document.getElementById('statusFilter').value;
            return allRows.filter(r => {
                if (statusF && r.status !== statusF) return false;
                if (!q) return true;
                return [r.name, r.phone, r.city, r.reference_id].some(v => (v || '').toLowerCase().includes(q));
            });
        }

        function renderTable() {
            const rows = filteredRows();
            const tbody = document.getElementById('tableBody');

            if (rows.length === 0) {
                tbody.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
            document.getElementById('emptyState').style.display = 'none';

            tbody.innerHTML = rows.map(r => `
                <tr onclick="openDrawer('${r.id}')">
                    <td class="name-cell">${escHtml(r.name)}</td>
                    <td>${escHtml(r.phone)}${r.is_whatsapp ? '<span class="badge-tag wa">WA</span>' : ''}
                        <div class="sub">${escHtml(r.email) || ''}</div></td>
                    <td>${escHtml(r.city)}</td>
                    <td class="sub">${escHtml(r.bill_range) || '—'}</td>
                    <td class="sub">${r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—'}</td>
                    <td><span class="status-pill ${escHtml(r.status || 'new')}">${escHtml(statusLabel(r.status))}</span></td>
                    <td><button class="btn-pdf" title="Download PDF" onclick="event.stopPropagation(); downloadSubmissionPDF('${r.id}')">📄</button></td>
                </tr>
            `).join('');
        }

        document.getElementById('searchBox').addEventListener('input', renderTable);
        document.getElementById('statusFilter').addEventListener('change', renderTable);

        // ── DETAIL DRAWER ─────────────────────────────────────────────
        const SYSTEM_TYPE_LABELS = { on_grid: 'On-grid', off_grid: 'Off-grid', hybrid: 'Hybrid (battery)', unsure: 'Not sure yet' };
        const SYSTEM_SIZE_LABELS = { under_3kw: 'Under 3 kW', '3_5kw': '3 – 5 kW', '5_10kw': '5 – 10 kW', '10kw_plus': '10 kW+' };

        function openDrawer(id) {
            const r = allRows.find(x => x.id === id);
            if (!r) return;
            currentDrawerId = id;

            document.getElementById('dName').textContent = r.name;
            document.getElementById('dSub').textContent = `${r.reference_id || '—'} · ${r.city} · ${r.property_type === 'business' ? 'Business' : 'Home'} · ${r.property_owned === false ? 'Rented' : 'Owned'}`;
            document.getElementById('dList').innerHTML = `
                <dt>Phone</dt><dd>${escHtml(r.phone)} ${r.is_whatsapp ? '<span class="badge-tag wa">WA</span>' : ''}</dd>
                <dt>Email</dt><dd>${escHtml(r.email) || '—'}</dd>
                <dt>System type</dt><dd>${SYSTEM_TYPE_LABELS[r.system_type] || 'Not sure yet'}</dd>
                <dt>System size</dt><dd>${SYSTEM_SIZE_LABELS[r.system_size] || 'Not sure'}</dd>
                <dt>Bill range</dt><dd>${escHtml(r.bill_range) || '—'}</dd>
                <dt>Best time</dt><dd>${escHtml(r.preferred_time) || 'Anytime'}</dd>
                <dt>Consent</dt><dd>${r.consent ? 'Yes' : '—'}</dd>
                <dt>Submitted</dt><dd>${r.created_at ? new Date(r.created_at).toLocaleString('en-IN') : '—'}</dd>
            `;
            document.getElementById('dMessage').textContent = r.message || 'No message left.';
            const statusSel = document.getElementById('dStatus');
            statusSel.innerHTML = STATUSES.map(s => `<option value="${s}" ${s === (r.status||'new') ? 'selected' : ''}>${statusLabel(s)}</option>`).join('');

            document.getElementById('drawer').classList.add('open');
            document.getElementById('drawerOverlay').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('open');
            currentDrawerId = null;
        }

        document.getElementById('dStatus').addEventListener('change', async (e) => {
            if (!currentDrawerId) return;
            const newStatus = e.target.value;
            const { error } = await sb.from('eoi_submissions').update({ status: newStatus }).eq('id', currentDrawerId);
            if (error) { showToast('❌ Could not update status'); return; }
            const row = allRows.find(r => r.id === currentDrawerId);
            if (row) row.status = newStatus;
            renderKPIs();
            renderTable();
            showToast('✓ Status updated');
        });

        // ── EXPORT ────────────────────────────────────────────────────
        // The reference number is generated client-side by the customer
        // form (4 random letters + 6-char timestamp, 10 chars total) and
        // stored directly in the "reference_id" column — read it straight
        // from the row rather than deriving it, so there's exactly one
        // source of truth instead of two formulas that could drift apart.
        function exportCSV() {
            const rows = filteredRows();
            if (rows.length === 0) { showToast('Nothing to export'); return; }
            const headers = ['Reference','Name','Phone','WhatsApp','Email','City','Property Type','Owned or Rented','System Type','System Size','Bill Range','Preferred Time','Consent','Status','Submitted','Message'];
            const csvRows = [headers.join(',')];
            rows.forEach(r => {
                const line = [
                    r.reference_id, r.name, r.phone, r.is_whatsapp ? 'Yes' : 'No',
                    r.email, r.city,
                    r.property_type, r.property_owned === false ? 'Rented' : 'Owned',
                    SYSTEM_TYPE_LABELS[r.system_type] || 'Not sure', SYSTEM_SIZE_LABELS[r.system_size] || 'Not sure',
                    r.bill_range, r.preferred_time, r.consent ? 'Yes' : 'No',
                    r.status, r.created_at, r.message
                ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',');
                csvRows.push(line);
            });
            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tengo-solar-eoi-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ── PDF EXPORT (single submission) ───────────────────────────
        function downloadSubmissionPDF(id) {
            const r = allRows.find(x => x.id === id);
            if (!r) { showToast('Could not find that submission'); return; }
            if (!window.jspdf) { showToast('⚠️ PDF library failed to load'); return; }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();

            // Header band, matching the amber brand color
            doc.setFillColor(224, 123, 10);
            doc.rect(0, 0, pageWidth, 72, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(18);
            doc.text('Tengo Solar', 40, 34);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10.5);
            doc.text('Expression of Interest — Submission Record', 40, 52);

            let y = 104;
            doc.setTextColor(20, 20, 20);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(15);
            doc.text(r.name || 'Unnamed submission', 40, y);

            const refId = r.reference_id || '—';
            y += 18;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(110, 110, 110);
            doc.text(`Reference: ${refId}`, 40, y);
            y += 13;
            doc.text(`Submitted: ${r.created_at ? new Date(r.created_at).toLocaleString('en-IN') : '—'}`, 40, y);

            y += 32;
            doc.setDrawColor(220, 220, 220);
            doc.line(40, y, pageWidth - 40, y);
            y += 26;

            const fields = [
                ['Phone', `${r.phone || '—'}${r.is_whatsapp ? '  (WhatsApp)' : ''}`],
                ['Email', r.email || '—'],
                ['City', r.city || '—'],
                ['Property', `${r.property_type === 'business' ? 'Business' : 'Home'} · ${r.property_owned === false ? 'Rented' : 'Owned'}`],
                ['System Type', SYSTEM_TYPE_LABELS[r.system_type] || 'Not sure yet'],
                ['System Size', SYSTEM_SIZE_LABELS[r.system_size] || 'Not sure'],
                ['Monthly Bill Range', r.bill_range || 'Not specified'],
                ['Preferred Contact Time', r.preferred_time || 'Anytime'],
                ['Consent to Contact', r.consent ? 'Yes' : 'Not recorded'],
                ['Status', statusLabel(r.status)]
            ];
            fields.forEach(([label, val]) => {
                doc.setTextColor(20, 20, 20);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.text(label, 40, y);
                doc.setFont('helvetica', 'normal');
                doc.text(String(val), 210, y);
                y += 22;
            });

            y += 12;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.text('Message', 40, y);
            y += 16;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(60, 60, 60);
            const msgLines = doc.splitTextToSize(r.message || 'No message left.', pageWidth - 80);
            doc.text(msgLines, 40, y);

            const safeName = (r.name || 'submission').trim().replace(/\s+/g, '-').toLowerCase();
            doc.save(`tengo-solar-eoi-${safeName}-${refId}.pdf`);
        }
    </script>
</body>
</html>
